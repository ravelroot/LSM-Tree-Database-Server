name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/rotina/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ · ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build redis-tools
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DARCA_WERROR=ON
      - run: cmake --build build
      - run: ./build/arca-tests
      - name: Servidor com redis-cli
        run: |
          ./build/arca-server --dir /tmp/arca-ci --port 7379 &
          sleep 1
          redis-cli -p 7379 SET ola mundo
          test "$(redis-cli -p 7379 GET ola)" = "mundo"
          redis-cli -p 7379 SQL "CREATE TABLE t (id INT PRIMARY KEY, nome TEXT)"
          redis-cli -p 7379 SQL "INSERT INTO t VALUES (1, 'a'), (2, 'b')"
          ./build/arca-cli SQL "SELECT COUNT(*) FROM t"
          ./build/arca-bench -n 20000 -c 4
          redis-cli -p 7379 SHUTDOWN

  sanitizers:
    name: C++ · ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DARCA_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build --target arca-tests
      - run: ./build/arca-tests

  windows:
    name: C++ · Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
      - run: ./build/Release/arca-tests.exe

  gateway:
    name: Go · gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - working-directory: gateway
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  painel:
    name: React · painel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build

  docker:
    name: Docker · imagens
    runs-on: ubuntu-24.04
    needs: [cpp, gateway, painel]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
