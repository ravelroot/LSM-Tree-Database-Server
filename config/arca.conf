bind 127.0.0.1
port 7379
dir dados
requirepass ""
io-threads 2
worker-threads 4
appendfsync everysec
write-buffer-size 4mb
max-file-size 2mb
level1-max-bytes 10mb
block-cache-size 64mb
bloom-bits-per-key 10
maxclients 10000
timeout 0
proto-max-bulk-len 64mb
slowlog-log-slower-than 10000
slowlog-max-len 128
loglevel info
